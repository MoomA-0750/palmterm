<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1e1e1e" />
    <title>palmterm</title>
  </head>
  <body>
    <div id="app">
      <div id="status" hidden></div>
      <div id="term-wrap">
        <div id="term" aria-label="端末"></div>
        <div id="tmuxpanel" role="toolbar" aria-label="tmux のウィンドウとペイン" hidden></div>
      </div>
      <div id="tabbar">
        <div id="tabs" role="tablist" aria-label="tmux のウィンドウ"></div>
        <button id="new-window" type="button" aria-label="新しいウィンドウ" title="新しいウィンドウ">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </div>
      <div id="keyrow">
        <div id="keybar" role="toolbar" aria-label="特殊キー"></div>
        <button id="tmux-btn" type="button" aria-label="tmux のウィンドウとペイン" aria-expanded="false" title="ウィンドウ・ペイン">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M12 4v16M12 12h9" />
          </svg>
        </button>
      </div>
      <div id="attachments" aria-label="添付する画像" hidden></div>
      <div id="inputbar">
        <textarea id="line" rows="1" placeholder="Ctrl+Enter か送信ボタンで送る" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="enter"></textarea>
        <button id="send" type="button" aria-label="送信" title="送信（Ctrl+Enter）"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4l-5 16-3.5-6.5z" /><path d="M11.5 13.5 20 4" /></svg></button>
        <button id="copy" type="button" aria-label="コピー（履歴から選ぶ）" title="コピー（履歴から選ぶ）"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3" /></svg></button>
        <button id="paste" type="button" aria-label="貼り付け" title="貼り付け"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2" /><rect x="9" y="3" width="6" height="4" rx="1" /><path d="M9 12h6M9 16h4" /></svg></button>
        <button id="upload" type="button" aria-label="画像を添付" title="画像を添付"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="2" /><path d="m21 16-5-5-9 9" /></svg></button>
        <input id="upload-input" type="file" accept="image/*" multiple hidden />
      </div>
    </div>

    <div id="copymode" hidden>
      <div class="copy-bar">
        <button id="copy-close" type="button">閉じる</button>
        <button id="copy-refresh" type="button">更新</button>
        <span class="spacer"></span>
        <button id="copy-to-line" type="button">入力欄へ</button>
        <button id="copy-selection" type="button">選択をコピー</button>
      </div>
      <pre id="copy-text"></pre>
    </div>

    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
