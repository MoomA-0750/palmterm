# palmterm の設定ファイルの見本 / Example palmterm config
#
# ~/.config/palmterm/config.toml に置く（-config で場所を変えられる）。
# 書き換えたら、ブラウザでページを読み込み直せば反映される（サーバーの再起動は要らない）。
# Put this at ~/.config/palmterm/config.toml (or pass -config). Reload the page to apply changes.

# 設定ファイルの書き方の版 / Config format version（書かなければ 1 / defaults to 1。版 1 の書き方もそのまま読める / version 1 files still work）
version = 2

# 画面の言語 / UI language: "en"（既定 / default）or "ja"
language = "en"

# 画面の色 / Colors
[theme]
# 組み込みのテーマ / Built-in theme: "default"（既定 / default）, "light", "solarized-dark", "solarized-light",
#   "rose-pine", "rose-pine-moon", "rose-pine-dawn", "catppuccin-latte", "catppuccin-frappe", "catppuccin-macchiato", "catppuccin-mocha"
# 画面の tmux パネルの「テーマ」で選ぶと、この行が書き換わる / Picking a theme in the tmux panel rewrites this line
name = "default"
# [theme] に書けるのは name だけ。色を変えたいときは、下の [themes.名前] に自分のテーマを作り、name にその名前を書く。
# Only name goes in [theme]. To change colors, make your own theme in [themes.<name>] below and put its name here.

# 自分のテーマ / Your own themes（[themes.名前] / [themes.<name>]。いくつでも書ける / as many as you like）
# base で組み込みのテーマを選び（書かなければ "default"）、書いた色だけ base の色を上書きする（"#rrggbb" か "#rgb"）。
# 書き間違えた色は画面で知らせ、base の色に戻す。テーマの一覧にも、組み込みのテーマの後ろに並ぶ。
# base picks a built-in theme (defaults to "default"); colors you write override it ("#rrggbb" or "#rgb").
# A mistyped color is reported on the page and the base color is used. Your themes also appear in the theme list.
# [themes.my-dark]
# base = "solarized-dark"
# background = "#1e1e1e"   # 端末と画面の背景 / terminal and page background
# foreground = "#d4d4d4"   # 端末の文字 / terminal text
# cursor = "#aeafad"
# accent = "#ff5f87"       # ボタンの強調の色 / button accent
# 端末の16色 / The 16 terminal colors:
#   black red green yellow blue magenta cyan white
#   bright_black bright_red bright_green bright_yellow bright_blue bright_magenta bright_cyan bright_white
# red = "#f44747"
# 使うときは [theme] を name = "my-dark" にする / To use it, set name = "my-dark" in [theme]

# 端末のフォント / Terminal font（書かなければ JetBrains Mono / JetBrains Mono if unset）
[font]
# 使うフォントを優先する順に並べる。文字ごとに、並びの先頭から順にその文字を持つフォントで描く。
# Fonts in order of preference. Each character is drawn with the first font in the list that has it.
#   - .ttf・.otf・.ttc・.woff・.woff2 で終わればファイル（相対パスはこのファイルのあるフォルダから数える）
#     Ends in .ttf, .otf, .ttc, .woff or .woff2: a font file (relative paths start at this file's folder)
#   - "JetBrains Mono" は palmterm の組み込み / "JetBrains Mono": built into palmterm
#   - ほかは PC に入っているフォントの名前。palmterm がファイルを探してスマホに配り、PC に無ければスマホの同じ名前のフォントを使う
#     Anything else: the name of a font installed on the PC; palmterm finds and serves its file, or uses a font
#     of that name on the phone if the PC does not have it
# フォントの一覧の「使う」で選ぶと、stack はそのフォント1つになる / Tapping Use in the font list sets stack to that one font
# stack = ["fonts/MyMono.woff2", "Noto Sans Mono CJK JP", "JetBrains Mono"]
#
# 版 1 の書き方（stack と一緒には書けない） / The version 1 way (cannot be used together with stack):
# family = "Liberation Mono"   # PC に入っているフォントの名前 / name of a font installed on the PC
# file = "fonts/MyFont.ttf"    # family で探す代わりに配るファイル / a font file to serve instead of looking up family

# キーバーのキー。書いた順に左から並ぶ。[[keys]] を1つでも書くと、既定の並びを丸ごと置き換える。
# Keys on the key bar, left to right. Any [[keys]] entry replaces the whole default set.
#
# 1つのキーに、次のどれか1つを書く / Each key has exactly one of:
#   key  = 特殊キーか1文字に、修飾キーを + でつないだもの / a special key or a character, with modifiers joined by +
#          例 / e.g. "esc", "tab", "ctrl+c", "alt+b", "ctrl+shift+tab", "alt+left", "ctrl+space", "ctrl++"
#          特殊キー / special keys: esc tab enter backspace delete insert up down left right
#                                   home end pageup pagedown f1 … f12 space
#          修飾キー / modifiers: ctrl alt shift（meta は alt と同じ / meta = alt）
#   mod  = "ctrl" / "alt" / "shift"
#          1回押すと次のキー（キーボードの文字も）に1回だけ効く。すばやく2回押すと固定、もう一度押すと解除。
#          Sticky modifier: one tap applies it to the next key; a quick double tap locks it; tap again to release.
#   text = そのまま送る文字 / text sent as is（"\u001b" のようなエスケープも書ける / escapes allowed）
#
# 省略できるもの / Optional:
#   label  = ボタンの表示 / button label（省略時はキーから決める / derived from the key）
#   icon   = アイコン / icon: left right up down backspace enter close plus splitH splitV
#            maximize cycle panes textSmaller textLarger
#   repeat = 押し続けたら繰り返すか / auto-repeat while held（矢印・backspace・delete・pageup・pagedown は既定で true）

# 以下は既定の並び / The default set:

[[keys]]
key = "esc"

[[keys]]
key = "tab"

[[keys]]
mod = "ctrl"

[[keys]]
mod = "alt"

[[keys]]
mod = "shift"

[[keys]]
key = "left"

[[keys]]
key = "down"

[[keys]]
key = "up"

[[keys]]
key = "right"

[[keys]]
key = "enter"

[[keys]]
key = "ctrl+c"

[[keys]]
key = "ctrl+d"

[[keys]]
key = "home"

[[keys]]
key = "end"

[[keys]]
key = "pageup"

[[keys]]
key = "pagedown"

[[keys]]
text = "|"

[[keys]]
text = "~"

[[keys]]
text = "/"

[[keys]]
text = "-"

[[keys]]
text = "`"

# 足すときの例 / More examples:
#
# [[keys]]
# key = "ctrl+r"          # シェルの履歴検索 / shell history search
#
# [[keys]]
# key = "shift+tab"       # Claude Code のモード切り替え / Claude Code mode cycling
# label = "S-Tab"
#
# [[keys]]
# text = ":wq\r"          # vim で保存して閉じる / save and quit in vim
# label = ":wq"
